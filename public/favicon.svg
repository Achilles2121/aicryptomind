<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Chart candlesticks -->
  <rect x="18" y="55" width="8" height="20" rx="1" fill="#ef4444"/>
  <line x1="22" y1="50" x2="22" y2="80" stroke="#ef4444" stroke-width="2"/>
  <rect x="32" y="40" width="8" height="25" rx="1" fill="url(#green)"/>
  <line x1="36" y1="35" x2="36" y2="70" stroke="#10b981" stroke-width="2"/>
  <rect x="46" y="30" width="8" height="30" rx="1" fill="url(#green)"/>
  <line x1="50" y1="25" x2="50" y2="65" stroke="#10b981" stroke-width="2"/>
  <rect x="60" y="35" width="8" height="20" rx="1" fill="#ef4444"/>
  <line x1="64" y1="30" x2="64" y2="60" stroke="#ef4444" stroke-width="2"/>
  <rect x="74" y="25" width="8" height="35" rx="1" fill="url(#green)"/>
  <line x1="78" y1="20" x2="78" y2="65" stroke="#10b981" stroke-width="2"/>
  <!-- Trend line -->
  <path d="M 18 70 Q 40 50, 50 35 T 82 22" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- AI dot -->
  <circle cx="82" cy="22" r="6" fill="url(#accent)">
    <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
